<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a5f">
<title>Haftalık Ders Programı Oluşturucu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  body{font-family:Inter,sans-serif;background:#eef1f6;-webkit-tap-highlight-color:transparent}
  .display{font-family:'Bricolage Grotesque',Inter,sans-serif}
  .drag-over{background:#dbeafe!important;outline:2px dashed #2563eb;outline-offset:-2px}
  .dragging{opacity:.4}
  .pdf-hide{display:none!important}
  .pill.sel{outline:3px solid #1e3a5f;outline-offset:2px}
  body.picking .cell{cursor:copy}
  @media (hover:none){.del{opacity:1!important}}
  summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
  :focus-visible{outline:2px solid #2563eb;outline-offset:2px}
</style>
</head>
<body class="text-slate-800">
<div class="lg:flex lg:h-screen">

<!-- ===== ARAÇLAR ===== -->
<aside class="lg:w-[350px] lg:shrink-0 lg:h-full lg:overflow-y-auto bg-white border-b lg:border-b-0 lg:border-r border-slate-200 p-4 sm:p-5 space-y-4">
  <div>
    <h1 class="display text-2xl font-extrabold text-[#1e3a5f] leading-tight">Ders Programım</h1>
    <p class="text-xs text-slate-500">Bir ders seç, sonra tablodaki saate dokun. Bilgisayarda sürükleyebilirsin.</p>
  </div>

  <details id="dInfo" class="rounded-xl border border-slate-200 bg-slate-50">
    <summary class="px-4 py-2.5 text-sm font-semibold flex justify-between">Öğrenci bilgileri <span class="text-slate-400">▾</span></summary>
    <div class="px-4 pb-4 space-y-2">
      <input id="nameIn" placeholder="Ad Soyad" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200">
      <input id="classIn" placeholder="Sınıf / Şube" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200">
      <div class="grid grid-cols-2 gap-2 pt-1">
        <label class="text-xs text-slate-500">İlk saat
          <select id="startSel" class="mt-1 w-full px-2 py-2 text-sm rounded-lg border border-slate-200 bg-white"></select></label>
        <label class="text-xs text-slate-500">Son saat
          <select id="endSel" class="mt-1 w-full px-2 py-2 text-sm rounded-lg border border-slate-200 bg-white"></select></label>
      </div>
    </div>
  </details>

  <details id="dNew" class="rounded-xl border border-slate-200 bg-slate-50">
    <summary class="px-4 py-2.5 text-sm font-semibold flex justify-between">Yeni ders ekle <span class="text-slate-400">▾</span></summary>
    <div class="px-4 pb-4 flex gap-2">
      <input id="newName" maxlength="24" placeholder="Ders adı" class="min-w-0 flex-1 px-3 py-2 text-sm rounded-lg border border-slate-200">
      <input id="newColor" type="color" value="#f59e0b" aria-label="Ders rengi" class="w-11 h-10 p-1 rounded-lg border border-slate-200 bg-white">
      <button id="addBtn" class="px-4 rounded-lg bg-[#1e3a5f] text-white text-sm font-semibold">Ekle</button>
    </div>
  </details>

  <div>
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-sm font-semibold">Dersler</h2>
      <span id="total" class="text-xs text-slate-500"></span>
    </div>
    <div id="palette" class="flex flex-wrap gap-2"></div>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-1 gap-2 pt-1">
    <button id="pdfBtn" class="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm">PDF olarak indir</button>
    <button id="clearBtn" class="py-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-medium text-sm">Programı temizle</button>
  </div>
</aside>

<!-- ===== TABLO ===== -->
<main class="flex-1 lg:h-full lg:overflow-y-auto p-3 sm:p-6">
  <div id="selBar" class="hidden sticky top-2 z-30 mb-3 mx-auto max-w-[1240px] items-center justify-between rounded-xl bg-[#1e3a5f] text-white px-4 py-2.5 text-sm shadow-lg">
    <span id="selTxt"></span>
    <button id="selX" class="underline text-white/80">Vazgeç</button>
  </div>

  <div id="sheet" class="mx-auto max-w-[1240px] bg-white rounded-2xl shadow-xl border border-slate-200 p-4 sm:p-6">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 pb-4 mb-4 border-b-2 border-[#1e3a5f]">
      <div>
        <h2 class="display text-2xl sm:text-3xl font-extrabold text-[#1e3a5f]">Haftalık Ders Programı</h2>
        <p class="text-xs text-slate-500">Çalışma planı</p>
      </div>
      <div class="flex gap-5 text-sm">
        <div><div class="text-[11px] text-slate-400">Öğrenci</div><div id="pName" class="font-bold"></div></div>
        <div><div class="text-[11px] text-slate-400">Sınıf</div><div id="pClass" class="font-bold text-blue-700"></div></div>
      </div>
    </div>

    <div class="overflow-x-auto rounded-xl border border-slate-200">
      <table class="w-full min-w-[720px] border-collapse text-center">
        <thead><tr id="thead" class="bg-[#1e3a5f] text-white text-xs"></tr></thead>
        <tbody id="tbody" class="text-xs"></tbody>
      </table>
    </div>
    <div class="mt-3 text-[11px] text-slate-400 flex justify-between"><span>Düzenli çalışma başarıyı getirir.</span><span id="dateTxt"></span></div>
  </div>
</main>
</div>

<script>
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const $=id=>document.getElementById(id);
const DEF=[['Matematik','#dc2626'],['Fizik','#2563eb'],['Kimya','#059669'],['Edebiyat','#7c3aed'],['Tarih','#ea580c'],['İngilizce','#0891b2'],['Coğrafya','#0d9488'],['Biyoloji','#16a34a'],['Almanca','#b45309'],['Kitap Okuma','#db2777']];
let S={name:'Ahmet Yılmaz',cls:'11-A Fen',start:10,end:23,courses:DEF.map((c,i)=>({id:'c'+i,name:c[0],color:c[1]})),grid:{}};
try{const x=JSON.parse(localStorage.getItem('dersProgrami')||'null');if(x&&x.courses)S=x}catch(e){}
let sel=null,drag=null;
const save=()=>{try{localStorage.setItem('dersProgrami',JSON.stringify(S))}catch(e){}};
const course=id=>S.courses.find(c=>c.id===id);
const hh=h=>String(h%24).padStart(2,'0')+':00';

// saat seçicileri
for(let h=6;h<=23;h++){
  $('startSel').add(new Option(hh(h),h));
  $('endSel').add(new Option(hh(h)+' - '+hh(h+1),h));
}

function buildTable(){
  const today=(new Date().getDay()+6)%7;
  $('thead').innerHTML='<th class="py-2.5 px-2 w-[74px] sticky left-0 bg-[#1e3a5f] z-[1]">Saat</th>'+
    DAYS.map((d,i)=>`<th class="py-2.5 px-1 ${i===today?'bg-blue-600':''}">${d}</th>`).join('');
  let h='';
  for(let t=S.start;t<=S.end;t++){
    h+=`<tr class="${t%2?'bg-white':'bg-slate-50'} border-t border-slate-200"><td class="sticky left-0 z-[1] bg-slate-100 border-r border-slate-200 py-1 font-bold text-[11px]">${hh(t)}<br><span class="font-normal text-slate-400 text-[9px]">${hh(t+1)}</span></td>`+
      DAYS.map((_,i)=>`<td class="cell p-1 h-11 border-r border-slate-100 last:border-r-0 min-w-[84px]" data-k="${i}-${t}"></td>`).join('')+'</tr>';
  }
  $('tbody').innerHTML=h;paintGrid();
}

function paintGrid(){
  const counts={};
  document.querySelectorAll('.cell').forEach(td=>{
    const k=td.dataset.k,c=course(S.grid[k]);td.innerHTML='';
    if(!c)return;
    counts[c.id]=(counts[c.id]||0)+1;
    const d=document.createElement('div');
    d.className='group relative h-full min-h-[36px] rounded-lg text-white font-semibold text-[11px] flex items-center justify-center px-1.5 shadow-sm';
    d.style.background=c.color;d.draggable=true;d.dataset.card=k;
    const s=document.createElement('span');s.className='truncate pointer-events-none';s.textContent=c.name;d.appendChild(s);
    const x=document.createElement('button');x.className='del pdf-ignore absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-white text-rose-600 border border-rose-200 text-xs leading-none opacity-0 group-hover:opacity-100 shadow';
    x.textContent='×';x.dataset.del=k;x.setAttribute('aria-label','Sil');d.appendChild(x);
    td.appendChild(d);
  });
  paintPalette(counts);
  const n=Object.values(counts).reduce((a,b)=>a+b,0);
  $('total').textContent=n?`Haftada ${n} saat`:'';
  save();
}

function paintPalette(counts=null){
  if(!counts){paintGrid();return}
  $('palette').innerHTML='';
  S.courses.forEach(c=>{
    const p=document.createElement('div');
    p.className='pill flex items-center gap-1.5 pl-3.5 pr-1.5 py-1.5 rounded-full text-xs font-semibold text-white cursor-pointer select-none shadow-sm'+(sel===c.id?' sel':'');
    p.style.background=c.color;p.draggable=true;p.dataset.id=c.id;
    p.innerHTML='<span class="n"></span><span class="cnt bg-white/25 rounded-full px-1.5 text-[10px]"></span><button class="rm w-4 h-4 rounded-full bg-white/25 text-[10px] leading-none" aria-label="Dersi kaldır">×</button>';
    p.querySelector('.n').textContent=c.name;
    const cnt=p.querySelector('.cnt');counts[c.id]?cnt.textContent=counts[c.id]+' sa':cnt.remove();
    $('palette').appendChild(p);
  });
}

function setSel(id){
  sel=id;const c=course(id);
  $('selBar').classList.toggle('hidden',!c);$('selBar').classList.toggle('flex',!!c);
  document.body.classList.toggle('picking',!!c);
  if(c)$('selTxt').textContent=`Seçili: ${c.name}. Yerleştirmek için saate dokun.`;
  paintPalette({});paintGrid();
}
$('selX').onclick=()=>setSel(null);

// palet
$('palette').addEventListener('click',e=>{
  const p=e.target.closest('.pill');if(!p)return;
  const id=p.dataset.id;
  if(e.target.closest('.rm')){
    const used=Object.values(S.grid).includes(id);
    if(used&&!confirm('Bu ders tabloda da kullanılıyor. Hepsiyle birlikte silinsin mi?'))return;
    S.courses=S.courses.filter(c=>c.id!==id);
    for(const k in S.grid)if(S.grid[k]===id)delete S.grid[k];
    if(sel===id)sel=null;setSel(sel);return;
  }
  setSel(sel===id?null:id);
});
$('palette').addEventListener('dragstart',e=>{
  const p=e.target.closest('.pill');if(!p)return;
  drag={id:p.dataset.id,from:null};e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='copyMove';
});

// tablo
const tb=$('tbody');
tb.addEventListener('click',e=>{
  const del=e.target.closest('[data-del]');
  if(del){delete S.grid[del.dataset.del];paintGrid();return}
  const td=e.target.closest('.cell');if(!td)return;
  const k=td.dataset.k;
  if(sel)S.grid[k]=sel;else if(S.grid[k])delete S.grid[k];
  paintGrid();
});
tb.addEventListener('dragstart',e=>{
  const c=e.target.closest('[data-card]');if(!c)return;
  drag={id:S.grid[c.dataset.card],from:c.dataset.card};e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move';
  c.classList.add('dragging');
});
tb.addEventListener('dragend',()=>{drag=null;paintGrid()});
tb.addEventListener('dragover',e=>{const td=e.target.closest('.cell');if(!td)return;e.preventDefault();td.classList.add('drag-over')});
tb.addEventListener('dragleave',e=>{const td=e.target.closest('.cell');td&&td.classList.remove('drag-over')});
tb.addEventListener('drop',e=>{
  const td=e.target.closest('.cell');if(!td||!drag)return;
  e.preventDefault();td.classList.remove('drag-over');
  const k=td.dataset.k,old=S.grid[k];
  S.grid[k]=drag.id;
  if(drag.from&&drag.from!==k){old?S.grid[drag.from]=old:delete S.grid[drag.from]}
  drag=null;paintGrid();
});

// yeni ders
function addCourse(){
  const n=$('newName').value.trim();
  if(!n){$('newName').focus();return}
  S.courses.push({id:'c'+Date.now(),name:n,color:$('newColor').value});
  $('newName').value='';paintGrid();
}
$('addBtn').onclick=addCourse;
$('newName').addEventListener('keydown',e=>{if(e.key==='Enter')addCourse()});

// bilgiler
$('nameIn').oninput=e=>{S.name=e.target.value;sync();save()};
$('classIn').oninput=e=>{S.cls=e.target.value;sync();save()};
function sync(){$('pName').textContent=S.name.trim()||'İsimsiz';$('pClass').textContent=S.cls.trim()||'-'}
$('startSel').onchange=e=>{S.start=+e.target.value;if(S.end<S.start){S.end=S.start;$('endSel').value=S.end}buildTable()};
$('endSel').onchange=e=>{S.end=+e.target.value;if(S.end<S.start){S.start=S.end;$('startSel').value=S.start}buildTable()};

$('clearBtn').onclick=()=>{if(confirm('Tüm program temizlensin mi?')){S.grid={};paintGrid()}};

// PDF
$('pdfBtn').onclick=()=>{
  const el=$('sheet'),btn=$('pdfBtn'),old=btn.textContent;
  const nm=(S.name.trim()||'Ogrenci').replace(/[^\wçğıöşüÇĞİÖŞÜ\s-]/g,'').replace(/\s+/g,'_');
  document.querySelectorAll('.pdf-ignore').forEach(x=>x.classList.add('pdf-hide'));
  const prev=el.style.width;el.style.width='1180px';el.style.maxWidth='none';
  btn.disabled=true;btn.textContent='Hazırlanıyor...';
  const done=()=>{el.style.width=prev;el.style.maxWidth='';document.querySelectorAll('.pdf-ignore').forEach(x=>x.classList.remove('pdf-hide'));btn.disabled=false;btn.textContent=old};
  html2pdf().set({margin:8,filename:nm+'_Haftalik_Ders_Programi.pdf',image:{type:'jpeg',quality:.98},
    html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}})
    .from(el).save().then(done).catch(()=>{done();alert('PDF oluşturulamadı, tekrar dene.')});
};

// başlangıç
$('nameIn').value=S.name;$('classIn').value=S.cls;
$('startSel').value=S.start;$('endSel').value=S.end;
$('dateTxt').textContent=new Date().toLocaleDateString('tr-TR');
if(innerWidth>=1024)$('dInfo').open=$('dNew').open=true;
sync();buildTable();
</script>
</body>
</html>
